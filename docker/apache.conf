ServerTokens Prod
ServerSignature Off
ServerName localhost

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.html index.php

<FilesMatch "(^\.|composer\.(json|lock)$|Dockerfile$|README\.md$)">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), geolocation=()"
